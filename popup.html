<!DOCTYPE html>
<html>
<head>
    <title>Teams Transcript Viewer</title>
    <style>
        body {
            width: 600px;
            max-height: 600px;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }
        h3 {
            margin-top: 0;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .view-buttons {
            display: flex;
            gap: 5px;
        }
        #response-container {
            width: 100%;
            height: 450px;
            overflow: auto;
            border: 1px solid #ccc;
            padding: 8px;
            box-sizing: border-box;
            background-color: #f9f9f9;
            border-radius: 4px;
            font-size: 13px;
        }
        #response-url {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            word-break: break-all;
            background-color: #f0f0f0;
            padding: 4px;
            border-radius: 3px;
        }
        #response-time {
            font-size: 11px;
            color: #888;
            margin-bottom: 10px;
        }
        pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        button {
            background-color: #4285f4;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover {
            background-color: #3367d6;
        }
        .status {
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <h3>
        <span>Teams Transcript Viewer</span>
        <button id="refresh-button">Refresh</button>
    </h3>
    <div id="response-url"></div>
    <div id="response-time"></div>
    <div class="controls">
        <div class="view-buttons">
            <button id="transcript-view">Transcript View</button>
            <button id="raw-view">Raw JSON</button>
        </div>
        <button id="copy-button">Copy JSON</button>
    </div>
    <div id="response-container">
        <pre id="response-content">Loading...</pre>
    </div>
    <script src="popup.js"></script>
</body>
</html>
